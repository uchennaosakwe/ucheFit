<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B5E3A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>UcheFit</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <img src="icon-192.png" alt="" class="logo">
    <div>
      <h1 id="appName">UcheFit</h1>
      <p id="dateLine" class="muted"></p>
    </div>
  </header>

  <main id="view"></main>

  <nav class="tabs">
    <button data-tab="today" class="active"><span>●</span>Today</button>
    <button data-tab="train"><span>▲</span>Train</button>
    <button data-tab="eat"><span>◆</span>Eat</button>
    <button data-tab="progress"><span>■</span>Progress</button>
    <button data-tab="me"><span>◎</span>Me</button>
  </nav>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
